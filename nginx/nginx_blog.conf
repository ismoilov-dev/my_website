# ==============================================================================
# Nginx Configuration for Django Blog / Portfolio (Ismat Ismoilov)
# Target Location: /etc/nginx/sites-available/blog
# Enable Command:  sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
# Test & Reload:   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ismatismoilov.uz www.ismatismoilov.uz _;

    # Maximum upload file size for media (PDFs, images, feed photos)
    client_max_body_size 100M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/blog_access.log;
    error_log /var/log/nginx/blog_error.log;

    # --------------------------------------------------------------------------
    # Static Files Serving (High performance direct Nginx delivery)
    # --------------------------------------------------------------------------
    location /static/ {
        # Replace /home/ismat-dev/Desktop/Python/blog with your server project path
        alias /home/ismat-dev/Desktop/Python/blog/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # Media Files Serving (Certificates, Feed Photos, Uploads)
    # --------------------------------------------------------------------------
    location /media/ {
        # Replace /home/ismat-dev/Desktop/Python/blog with your server project path
        alias /home/ismat-dev/Desktop/Python/blog/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # Gunicorn WSGI App Proxy
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        # If using UNIX socket:
        # proxy_pass http://unix:/run/blog.sock;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
