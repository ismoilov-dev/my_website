[tool.ruff]
line-length = 120
target-version = "py312"
# Migrations are generated by Django, not hand-written; linting them only
# creates churn that has to be re-fixed every time makemigrations runs.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Ignore Django-specific patterns (RUF012 for model Meta ordering, BLE001 for broad exception fallback in startup/health)
ignore = ["RUF012", "BLE001"]
