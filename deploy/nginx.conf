# nginx site config for ismat.dev
#
# Install on the VPS with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/blog
#   sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/blog
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the plain HTTP version. Once it serves the site, run
#   sudo certbot --nginx -d ismatismoilov.uz -d www.ismatismoilov.uz
# and certbot rewrites this file with the TLS block and the HTTP redirect.
#
# IMPORTANT: keep SECURE_SSL_REDIRECT=False in .env until certbot has run.
# Turning it on while nginx is HTTP-only sends browsers into a redirect loop.

upstream blog_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ismatismoilov.uz www.ismatismoilov.uz;

    # Certificate PDFs and feed photos are uploaded through the admin.
    client_max_body_size 20M;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    # --- Compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # --- Security headers ------------------------------------------------
    # Django sets X-Frame-Options and X-Content-Type-Options itself; these
    # cover what it does not.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- Static files ----------------------------------------------------
    # collectstatic fingerprints these (main.a1b2c3.css), so they are safe to
    # cache forever. WhiteNoise would also serve them, but nginx is faster and
    # keeps the request away from Python entirely.
    location /static/ {
        alias /srv/blog/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Media (user uploads) --------------------------------------------
    # Filenames are not fingerprinted, so cache for a shorter window.
    location /media/ {
        alias /srv/blog/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Health check ----------------------------------------------------
    location = /healthz/ {
        access_log off;
        proxy_pass http://blog_app;
        proxy_set_header Host $host;
    }

    # --- Application -----------------------------------------------------
    location / {
        proxy_pass http://blog_app;
        proxy_redirect off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know the request arrived over HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Do not hand out dotfiles such as .env or .git.
    location ~ /\. {
        deny all;
    }
}
